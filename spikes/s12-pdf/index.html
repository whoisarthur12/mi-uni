<!doctype html>
<html lang="es">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S12 — pdf-lib y pdf.js</title>
<link rel="stylesheet" href="../s10-plataforma/app/style.css">
<link rel="stylesheet" href="./s12.css">
<script type="module" src="./js/main.js"></script>
</head>
<body>
<h1>PDF: unir, miniaturas y render</h1>
<p class="muted">Todo ocurre en el dispositivo. Elige uno o varios PDF tuyos. Con archivos grandes puede tardar o cerrar la pestaña: si pasa, anótalo.</p>
<div class="row"><label for="files">PDFs</label> <input id="files" type="file" accept="application/pdf" multiple></div>
<div class="row">
  <button id="merge" type="button">Unir los elegidos</button>
  <button id="thumbsBtn" type="button">Miniaturas del primero</button>
  <button id="renderBtn" type="button">Render grande (página 1, ×2)</button>
</div>
<div class="row"><button id="fx" type="button" hidden>Fixtures</button><button id="copy" type="button">Copiar resultados</button></div>
<div id="thumbs" class="thumbs"></div>
<pre id="out"></pre>
</body>
</html>
